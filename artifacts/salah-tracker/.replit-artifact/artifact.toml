kind = "mobile"
previewPath = "/"
title = "Salah Tracker"
version = "1.0.0"
id = "artifacts/salah-tracker"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21633

[services.development]
run = "pnpm --filter @workspace/salah-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/salah-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/salah-tracker", "run", "serve" ]

[services.env]
PORT = "21633"
BASE_PATH = "/"
